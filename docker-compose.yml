services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamehub}
      POSTGRES_USER: ${POSTGRES_USER:-gamehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamehub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamehub} -d ${POSTGRES_DB:-gamehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gamehub}:${POSTGRES_PASSWORD:-gamehub}@db:5432/${POSTGRES_DB:-gamehub}
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://gameeyes.onrender.com}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
  static_data: